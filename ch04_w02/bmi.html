<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #a0dfbf;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #bbebce;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-family: 'Courier New', Courier, monospace;
            margin-bottom: 10px;
        }

        label {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 500;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #calculate-btn {
            background-color: #90ee90;
            width: 100%;
            color: #000;
            padding: 10px 20px;
            border: 0;
            margin-top: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            cursor: pointer;
        }

        #calculate-btn:hover {
            background-color: #64e264;
        }

        #BMI-value {
            background-color: #e0f7e0;
            margin-top: 20px;
            width: 100%;
            border: 2px solid #c0c0c0;
            color: #555;
        }
        #BMI-description {
            font-family: 'Courier New', Courier, monospace;
            margin: 20px 0;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <main>
        <div class="container">
            <h1>Body Mass Index (BMI) Calculator</h1>
            <div class="input-info">
                <label for="height">Your Height (cm):</label>
                <input type="number" id="height" name="height" placeholder="Enter your height" required>
                <label for="weight">Your Weight (kg):</label>
                <input type="number" id="weight" name="weight" step="0.1" placeholder="Enter your weight" required>
                <button onclick="calculateBMI()" id="calculate-btn">Compute BMI</button>
            </div>
            <div class="output-info">
                <p id="BMI-value">0</p>
                <p id="BMI-description"></p>
            </div>
        </div>
    </main>

    <script>
        function calculateBMI() {
            const heightInput = document.getElementById('height').value;
            const weightInput = document.getElementById('weight').value;

            if (heightInput && weightInput) {
                const heightInMeters = heightInput / 100; 
                const bmi = weightInput / (heightInMeters * heightInMeters);

                document.getElementById('BMI-value').innerHTML = bmi;
                document.getElementById('BMI-description').innerHTML = getBMIDescription(bmi);
            } else {
                alert("Please enter both height and weight.");
            }
        }

        function getBMIDescription(bmi) {
            if (bmi < 18.5) {
                return "Weight Condition: Underweight";
            } else if (bmi >= 18.5 && bmi <= 25) {
                return "Weight Condition: Normal weight";
            } else if (bmi > 25 && bmi <= 30) {
                return "Weight Condition: Overweight";
            } else {
                return "Weight Condition: Obese";
            }
        }
    </script>
</body>

</html>
