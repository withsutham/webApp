<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="top-navbar">
        <span class="subject">CSS-Week3</span>
        <span class="student-info">Sutham Wiyaset | Student ID: 6620503586</span>
        <div class="links">
            <a href="../index.html" class="nav-btn">Home</a>
            <a href="../contact/index.html" class="nav-btn">Contact</a>
            <a href="../register/index.html" class="nav-btn">Register</a>
            <a href="../webpage/index.html" class="nav-btn">Webpage</a>
        </div>
    </nav>
    <div class="contact-card">
        <header>
            <p>CONTACT US</p>
        </header>

        <div class="contact-type">
            <div class="choice">
                <input type="radio" id="sayhi" name="contact-type" value="Say Hi" checked="checked">
                <label for="sayhi">Say Hi</label>
            </div>
            <div class="choice">
                <input type="radio" id="getquote" name="contact-type" value="Get a Quote">
                <label for="getquote">Get a Quote</label>
            </div>
        </div>

        <div class="field">
            <input type="text" placeholder="Your Name">
        </div>

        <div class="field">
            <input type="text" placeholder="Your Email">
        </div>

        <div class="field message-field">
            <input type="text" placeholder="Your Message">
        </div>

        <button>SUBMIT</button>
    </div>
</body>
</html>
