<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matching Game</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #fff7c9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 100vh;
            min-height: 100dvh;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .top-navbar {
            width: 100%;
            height: auto;
            flex: 0 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #fff;
            border-bottom: 1px solid #e5e5e5;
            margin-bottom: 0;
        }

        .subject {
            font-size: 18px;
            font-weight: 700;
            color: #555;
        }

        .student-info {
            font-size: 18px;
            font-weight: 500;
            color: #555;
        }

        .game-container {
            width: min(100%, 420px);
            flex: 1 1 auto;
            min-height: 0;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .game {
            width: 100%;
            max-width: 420px;
            height: auto;
            aspect-ratio: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
        }

        .card {
            background-color: #bade86;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            line-height: 1;
            cursor: pointer;
            border: none;
            outline: none;
        }

        #reset-button {
            display: block;
            width: 100%;
            background-color: #737d57;
            color: #fff;
            border: none;
            margin: 12px;
            min-height: 42px;
            padding: 10px 18px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <nav class="top-navbar">
        <a href="index.html" class="subject">Javascript-3</a>
        <span class="student-info">Sutham Wiyaset | Student ID: 6620503586</span>
    </nav>
    <div class="game-container">
        <div id="game" class="game"></div>
        <button id="reset-button">Reset</button>
    </div>
    <script>
        let cards = [
        "🍎", "🍎",
        "🍇", "🍇",
        "🍍", "🍍",
        "🍊", "🍊",
        "🍓", "🍓",
        "🍉", "🍉",
        "🍌", "🍌",
        "🥝", "🥝"
        ];

        let firstCard = null;
        let secondCard = null;

        let waiting = false;

        function playGame() {
            let game = document.getElementById("game");
            game.innerHTML = "";

            firstCard = null;
            secondCard = null;
            waiting = false;

            cards.sort(() => 0.5 - Math.random());

            for (let i = 0; i < cards.length; i++) {
                let card = document.createElement("button");
                card.className = "card";
                card.innerHTML = "?";
                card.value = cards[i];
                card.addEventListener("click", openCard);
                game.appendChild(card);
            }
        }

        function openCard() {
            if (waiting) return;

            if (this === firstCard) return;

            if (this.innerHTML !== "?") return;

            this.innerHTML = this.value;

            if (!firstCard) {
                firstCard = this;
                return;
            }

            secondCard = this;

            if (firstCard.value === secondCard.value) {
                firstCard.removeEventListener("click", openCard);
                secondCard.removeEventListener("click", openCard);
                firstCard = null;
                secondCard = null;
            } else {
                waiting = true;
                setTimeout(() => {
                    firstCard.innerHTML = "?";
                    secondCard.innerHTML = "?";
                    firstCard = null;
                    secondCard = null;
                    waiting = false;
                }, 2000);
            }
        }

        document.getElementById("reset-button").addEventListener("click", playGame);

        playGame();
    </script>
</body>
</html>
