<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word List</title>
    <style>
        * {
            font-family: Comic Sans MS, cursive, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #adff2f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .word-list {
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            overflow: auto;
        }

        input[type="text"] {
            width: 360px;
            padding: 20px;
            border: 1px solid #ccc;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }

        ul {
            list-style-type: none;
        }

        li {
            background-color: #ffff00;
            padding: 10px;
            border-bottom: 1px solid #ccc;
            display: flex;
            align-items: center;
            border-bottom: 1px dashed #676767;
        }

        li:last-child {
            border-bottom: none;
        }

        .word-text {
            flex: 1;
            margin-right: 10px;
        }

        #delete-button {
            width: 15px;
            height: 15px;
            font-size: 8px;
            background-color: #f72c21;
        }
    </style>
</head>

<body>
    <main>
        <section class="word-list">
            <input
                type="text"
                id="word-input"
                placeholder="Enter your word"
                maxlength="3"
                minlength="3"
                pattern="[A-Za-z]{3}"
                required
            >
            <ul id="word-list"></ul>
        </section>
    </main>

    <script>
        const wordInput = document.getElementById('word-input');
        const wordList = document.getElementById('word-list');

        let words = JSON.parse(localStorage.getItem('words')) || [];

        wordInput.addEventListener('keypress', function (event) {
            if (event.key === 'Enter') {
                const wordText = wordInput.value.trim().toUpperCase();
                if (wordText !== '') {

                    if (!/^[A-Z]{3}$/.test(wordText)) {
                        alert("Please enter a valid 3-letter word.");
                        wordInput.value = '';
                        return;
                    }

                    const listItem = document.createElement('li');

                    const wordTextElement = document.createElement('span');
                    wordTextElement.className = 'word-text';
                    wordTextElement.innerHTML = wordText;

                    const deleteButton = document.createElement('button');
                    deleteButton.innerHTML = '🗑️';
                    deleteButton.id = 'delete-button';

                    listItem.appendChild(wordTextElement);
                    listItem.appendChild(deleteButton);
                    wordList.appendChild(listItem);
                    words.push(wordText);
                    saveWords();
                    wordInput.value = '';
                }
            }
        });

        wordList.addEventListener('click', function (event) {
            if (event.target.tagName === 'BUTTON') {
                event.target.parentElement.remove();
            }
        });

        function saveWords() {
            localStorage.setItem("words", JSON.stringify(words));
        }


    </script>
</body>

</html>
