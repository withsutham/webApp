<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word List</title>
    <style>
        * {
            
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #adff2f;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            font-family: Comic Sans MS, cursive, sans-serif;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            min-height: 42px;
            padding: 10px 20px;
            background-color: #fff;
            border-bottom: 1px solid #e5e5e5;
        }

        .subject {
            font-size: 18px;
            font-weight: 700;
            color: #555;
        }

        .student-info {
            font-size: 18px;
            font-weight: 500;
            color: #555;
        }

        .links {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn {
            display: block;
            padding: 4px 12px;
            color: #555;
            font-size: 12px;
            line-height: 1;
            text-decoration: none;
            border: 1px solid transparent;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background-color: #555;
            color: #fff;
            border-color: #555;
        }

        .word-list {
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            overflow: auto;
        }

        input[type="text"] {
            width: 360px;
            padding: 20px;
            border: 1px solid #ccc;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }

        ul {
            list-style-type: none;
        }

        li {
            background-color: #ffff00;
            padding: 10px;
            border-bottom: 1px solid #ccc;
            display: flex;
            align-items: center;
            border-bottom: 1px dashed #676767;
        }

        li:last-child {
            border-bottom: none;
        }

        .word-text {
            flex: 1;
            margin-right: 10px;
        }

        .delete-button {
            width: 15px;
            height: 15px;
            font-size: 8px;
            background-color: #f72c21;
        }
    </style>
</head>

<body>
    <nav class="top-navbar">
        <a href="index.html" class="subject">Javascript-3</a>
        <span class="student-info">Sutham Wiyaset | Student ID: 6620503586</span>
        <div class="links">
            <a href="wordgame.html" class="nav-btn">PLAY</a>
            <a href="wordlist.html" class="nav-btn">WORD LIST</a>
        </div>
    </nav>
    <main>
        <section class="word-list">
            <input
                type="text"
                id="word-input"
                placeholder="Enter your word"
                maxlength="3"
                minlength="3"
                pattern="[A-Za-z]{3}"
                required
            >
            <ul id="word-list"></ul>
        </section>
    </main>

    <script>
        const wordInput = document.getElementById('word-input');
        const wordList = document.getElementById('word-list');

        let words = JSON.parse(localStorage.getItem('words')) || [];

        function renderWords() {
            wordList.innerHTML = '';

            words.forEach(function (word, index) {
                const listItem = document.createElement('li');

                const wordTextElement = document.createElement('span');
                wordTextElement.className = 'word-text';
                wordTextElement.textContent = word;

                const deleteButton = document.createElement('button');
                deleteButton.type = 'button';
                deleteButton.className = 'delete-button';
                deleteButton.dataset.index = index;
                deleteButton.textContent = 'X';
                deleteButton.setAttribute('aria-label', `Delete ${word}`);

                listItem.appendChild(wordTextElement);
                listItem.appendChild(deleteButton);
                wordList.appendChild(listItem);
            });
        }

        renderWords();

        wordInput.addEventListener('keypress', function (event) {
            if (event.key === 'Enter') {
                const wordText = wordInput.value.trim().toUpperCase();
                if (wordText !== '') {

                    if (!/^[A-Z]{3}$/.test(wordText)) {
                        alert("Please enter a valid 3-letter word.");
                        wordInput.value = '';
                        return;
                    }

                    words.push(wordText);
                    saveWords();
                    renderWords();
                    wordInput.value = '';
                }
            }
        });

        wordList.addEventListener('click', function (event) {
            const deleteButton = event.target.closest('.delete-button');

            if (!deleteButton) return;

            const wordIndex = Number(deleteButton.dataset.index);
            words.splice(wordIndex, 1);
            saveWords();
            renderWords();
        });

        function saveWords() {
            localStorage.setItem("words", JSON.stringify(words));
        }


    </script>
</body>

</html>
